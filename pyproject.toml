[project]
name = "gazette"
version = "0.1.0"
description = "La gazette : de quoi parlent les rédactions françaises aujourd'hui ?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "prefect>=3.9,<4",
    "psycopg[binary]>=3.2",
]

[project.scripts]
gazette = "gazette.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gazette"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
