name: gazette

x-app: &app
  build:
    context: .
    target: runtime
  image: gazette:dev
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gazette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gazette}
      POSTGRES_DB: gazette
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazette -d gazette"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serveur Prefect (API + UI), historique des runs stocké dans Postgres
  prefect:
    <<: *app
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://gazette:${POSTGRES_PASSWORD:-gazette}@postgres:5432/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_HOME: /tmp/prefect
      # l'image tourne en non-root : l'UI doit être copiée dans un dossier inscriptible
      PREFECT_UI_STATIC_DIRECTORY: /tmp/prefect/ui
      # URL relative : l'UI marche depuis ce PC comme depuis le réseau local (BIND_ADDR=0.0.0.0)
      PREFECT_UI_API_URL: /api
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PREFECT_PORT:-4200}:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Sert le flow `ingest-feeds` (planning quotidien 5 h 30, Europe/Paris) et exécute les runs
  worker:
    <<: *app
    command: ["gazette", "serve"]
    environment:
      DATABASE_URL: postgresql://gazette:${POSTGRES_PASSWORD:-gazette}@postgres:5432/gazette
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_HOME: /tmp/prefect
    volumes:
      - ./data:/app/data
      - ./sources.csv:/app/sources.csv:ro
    depends_on:
      postgres:
        condition: service_healthy
      prefect:
        condition: service_healthy

volumes:
  pgdata:
